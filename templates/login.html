{% extends "base.html" %}

{% block title %}管理員登入{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow-lg p-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex p-3 mb-2">
                        <i class="bi bi-shield-lock-fill fs-2"></i>
                    </div>
                    <h4 class="fw-bold mb-1">管理員登入</h4>
                    <p class="text-muted small">後台受安全存取控制保護，請登入管理員帳號</p>
                </div>

                <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
                    <div class="mb-3">
                        <label for="username" class="form-label small fw-semibold">帳號 (Username)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" required autofocus placeholder="請輸入管理員帳號">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold">密碼 (Password)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" required placeholder="請輸入密碼">
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i>安全登入
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 text-muted extra-small" style="font-size: 0.78rem;">
                    <i class="bi bi-lock-fill me-1 text-success"></i>採用 Werkzeug 不可逆密碼雜湊機制防護
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
