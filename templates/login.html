{% extends "base.html" %}

{% block title %}管理員登入{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow-lg p-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex p-3 mb-2">
                        <i class="bi bi-shield-lock-fill fs-2"></i>
                    </div>
                    <h4 class="fw-bold mb-1">管理員登入</h4>
                    <p class="text-muted small">請輸入帳號密碼以管理訂單、客戶與商品</p>
                </div>

                <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
                    <div class="mb-3">
                        <label for="username" class="form-label small fw-semibold">帳號 (Username)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" value="admin" required autofocus placeholder="請輸入管理員帳號">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold">密碼 (Password)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" value="admin123" required placeholder="請輸入密碼">
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i>登入系統
                        </button>
                    </div>
                </form>

                <div class="alert alert-info border-0 bg-info bg-opacity-10 mt-4 mb-0 small">
                    <div class="d-flex gap-2">
                        <i class="bi bi-info-circle-fill text-info mt-1"></i>
                        <div>
                            <strong>預設測試帳密：</strong><br>
                            帳號：<code>admin</code><br>
                            密碼：<code>admin123</code>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
