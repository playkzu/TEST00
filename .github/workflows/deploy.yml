name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest -v

  deploy:
    name: Deploy to Render
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning ::RENDER_DEPLOY_HOOK_URL 未設定。如果已在 Render 設定自動連動 GitHub，Render 會自動感應推送並部屬；若想透過 GitHub Action 觸發，請在 GitHub Repository Secrets 新增 RENDER_DEPLOY_HOOK_URL。"
          else
            echo "正在觸發 Render 自動部屬..."
            curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render 部屬觸發成功！"
          fi
